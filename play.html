<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Play Swing Game</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-page="play">
  <div class="mobile-shell">
    <header class="pixel-header">
      <div>
        <p class="tiny-label">RETRO SWING CLUB</p>
        <h1>Stage Play</h1>
      </div>
      <button id="homeBtn" class="pixel-mini-btn">HOME</button>
    </header>

    <main class="page-stack">
      <div class="top-status-row">
        <div class="status-pill">TIME <strong id="timeValue">45</strong></div>
        <div class="status-pill">SCORE <strong id="scoreValue">0</strong></div>
        <div class="status-pill">ROUND <strong id="roundValue">1</strong></div>
      </div>

      <section class="screen-card play-card">
        <div class="pixel-stage-title">SWING STEP BOARD</div>
        <div class="board-inner">
          <div class="board-top-row">
            <div id="stageCharacter" class="board-character"></div>
            <div class="board-copy">
              <div id="selectedName" class="selected-name"></div>
              <div id="selectedLine" class="selected-line"></div>
            </div>
          </div>

          <div class="sequence-box">
            <p class="section-label">이번 순서</p>
            <div id="targetSequence" class="sequence-row"></div>
          </div>

          <div class="sequence-box progress-box">
            <p class="section-label">지금까지 입력</p>
            <div id="currentProgress" class="sequence-row progress-row"></div>
          </div>

          <div id="feedbackText" class="feedback-text">START!</div>
        </div>
      </section>

      <section class="screen-card button-card">
        <div class="pixel-stage-title small">TAP IN ORDER</div>
        <div id="moveButtons" class="move-grid"></div>
      </section>
    </main>
  </div>
  <script src="script.js"></script>
</body>
</html>
