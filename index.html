<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Swing Dancing Game</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-page="start">
  <div class="mobile-shell">
    <header class="pixel-header">
      <div>
        <p class="tiny-label">RETRO SWING CLUB</p>
        <h1>Swing Dancing Game</h1>
      </div>
      <button id="homeBtn" class="pixel-mini-btn">HOME</button>
    </header>

    <main class="center-page">
      <section class="screen-card title-card">
        <div class="pixel-stage-title">STAGE 1</div>
        <div class="hero-avatar-row">
          <div class="pixel-buddy cherry">🍒</div>
          <div class="pixel-buddy moka">☕</div>
          <div class="pixel-buddy cookie">🍪</div>
        </div>
        <h2>귀여운 스윙 캐릭터로<br />춤 순서를 맞춰봐!</h2>
        <p>
          캐릭터를 먼저 고르고, 정해진 스윙 동작을 순서대로 눌러서
          무대를 클리어하는 모바일형 레트로 게임.
        </p>
        <button id="startBtn" class="pixel-main-btn">게임 시작</button>
      </section>
    </main>
  </div>
  <script src="script.js"></script>
</body>
</html>
