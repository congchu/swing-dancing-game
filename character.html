<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Character Select</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-page="character">
  <div class="mobile-shell">
    <header class="pixel-header">
      <div>
        <p class="tiny-label">RETRO SWING CLUB</p>
        <h1>Character Select</h1>
      </div>
      <button id="homeBtn" class="pixel-mini-btn">HOME</button>
    </header>

    <main class="page-stack">
      <section class="screen-card">
        <div class="pixel-stage-title">CHARACTER SELECT</div>
        <p class="guide-text">오늘 플레이할 캐릭터를 골라줘</p>
        <div id="characterList" class="pixel-character-list"></div>
        <button id="goStageBtn" class="pixel-main-btn">이 캐릭터로 시작</button>
      </section>
    </main>
  </div>
  <script src="script.js"></script>
</body>
</html>
